name: Argos

# ─────────────────────────────────────────────────────────────────────────────
# project.yml es la ÚNICA FUENTE DE VERDAD del proyecto.
# El .xcodeproj se genera con `xcodegen generate` y se versiona como artefacto.
# Tras editar este archivo: ejecuta `xcodegen generate`. La CI verifica que no
# haya drift (genera y falla si el .pbxproj resultante difiere del commiteado).
# ─────────────────────────────────────────────────────────────────────────────

options:
  bundleIdPrefix: com.iaportafolio
  developmentLanguage: es
  deploymentTarget:
    # El terminal en vivo usa Citadel.withPTY / TTYOutput, marcados
    # @available(macOS 15.0, *). Mínimo: macOS 15.
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

# --- Swift Package Manager dependencies ---------------------------------------
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    # Pin estricto a minor: Citadel es <1.0; un salto de minor puede romper la API
    # de PTY/SSH que usamos. upToNextMinor evita actualizaciones incompatibles.
    minorVersion: 0.12.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    minorVersion: 1.13.0
  Sparkle:
    # Framework de auto-actualización (OTA). Firma sus updates con clave EdDSA propia
    # (independiente de Apple), así que funciona con builds ad-hoc.
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.9.3
  MarkdownUI:
    # Render de Markdown (con tablas/GFM) en el visor de archivos y en el agente.
    # En modo mantenimiento pero estable; pin a minor por seguridad.
    url: https://github.com/gonzalezreal/swift-markdown-ui
    minorVersion: 2.4.1

# Versión ÚNICA para todos los targets (Mac GitHub, Mac App Store, iOS). Sparkle y
# App Store comparan CURRENT_PROJECT_VERSION: debe crecer en cada release.
settings:
  base:
    MARKETING_VERSION: "1.7.15"
    CURRENT_PROJECT_VERSION: "44"

# Lo común a las dos variantes de Mac. Cada target añade sus entitlements, su
# Info.plist y sus dependencias (las listas no se fusionan con la plantilla).
targetTemplates:
  ArgosMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Argos
        # Cada variante usa su propio Info.plist/entitlements: no son recursos.
        excludes:
          - "Info.plist"
          - "Info-AppStore.plist"
          - "*.entitlements"
      # Núcleo multiplataforma (modelo, SSH, stores, view models). Lo compilan tanto
      # la app de Mac como ArgosiOS: NO puede importar AppKit/SwiftUI/SwiftTerm.
      - path: ArgosCore
      # Vistas SwiftUI compartidas Mac + iPhone/iPad (sin AppKit/UIKit): mascota e
      # iconos de agentes.
      - path: ArgosUI
    settings:
      base:
        PRODUCT_NAME: Argos
        PRODUCT_BUNDLE_IDENTIFIER: com.iaportafolio.argos
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_APP_SANDBOX: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        SWIFT_VERSION: "5.0"
        # Concurrencia estricta (data-race safety) en modo Swift 5: comprueba NUESTRO
        # código como WARNINGS. Los tipos no-Sendable de Citadel (SSHClient, PTY) se
        # reconocen con `@preconcurrency import Citadel`. Queda 1 fricción conocida de
        # AppKit (NSEvent en el monitor de scroll de LiveTerminalController). No se sube a
        # SWIFT_VERSION 6 todavía porque ese único warning pasaría a ser error; revisar
        # cuando Citadel adopte Sendable o se reescriba el monitor de scroll.
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        # Team de IA Portafolio (Impulse Vibes S.A.S.) para builds locales, archive y
        # App Store. La CI/release lo sobrescribe (DEVELOPMENT_TEAM="" + ad-hoc), así que
        # el canal GitHub+Sparkle no cambia.
        DEVELOPMENT_TEAM: L6WGLNT9XZ
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  # ── Canal GitHub (DMG + Sparkle OTA, firma ad-hoc) ───────────────────────────
  Argos:
    templates: [ArgosMac]
    # App Sandbox + Hardened Runtime ACTIVADOS. La clave SSH se lee por
    # security-scoped bookmark que el usuario concede al elegirla; la red saliente y
    # la lectura de archivos elegidos se conceden vía entitlements.
    entitlements:
      path: Argos/Argos.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # read-write: «Enviar al Mac» escribe la copia del proyecto en la carpeta elegida.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /.ssh/
        # Sparkle (sandbox): el Installer XPC corre fuera del sandbox y se comunica con
        # la app por estos nombres mach derivados del bundle id. $(PRODUCT_BUNDLE_IDENTIFIER)
        # lo sustituye Xcode al firmar.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        # Sparkle.framework viene firmado por su propio team; bajo Hardened Runtime con
        # firma ad-hoc (sin Team ID), Library Validation rechaza cargarlo (Team IDs
        # distintos). Esto lo permite. Aceptable en distribución ad-hoc; al notarizar con
        # Developer ID se re-firmaría el framework y podría quitarse.
        com.apple.security.cs.disable-library-validation: true
        # «Abrir en Terminal con Claude Code»: Apple Events SOLO a Terminal (do script).
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events:
          - com.apple.Terminal
    # Info.plist explícito: Sparkle requiere claves propias (SUFeedURL, etc.) que
    # GENERATE_INFOPLIST_FILE no permite inyectar.
    info:
      path: Argos/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Victor Alejandro · Licencia Apache-2.0"
        CFBundleIconName: AppIcon
        # App en español: hace que AppKit muestre los menús estándar (Archivo, Edición,
        # Visualización, Ventana, Ayuda…) y diálogos del sistema en español.
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
        # --- Sparkle (auto-actualización) ---
        SUFeedURL: https://github.com/victalejo/Argos/releases/latest/download/appcast.xml
        SUPublicEDKey: Sud7aRbwmy3N+CGAncEQdku4gCAEY6wYOMPHCM0SAN4=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        NSAppleEventsUsageDescription: "Argos abre Terminal en la copia local de tu proyecto y arranca Claude Code."
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: Sparkle
      - package: MarkdownUI

  # ── Canal Mac App Store ──────────────────────────────────────────────────────
  # MISMAS funciones que el canal GitHub, sin excepciones temporales de sandbox:
  #   · Actualizaciones: las entrega la App Store (Sparkle no se enlaza; flag APPSTORE).
  #   · ~/.ssh: el usuario concede la carpeta una vez (bookmark app-scope) en vez de
  #     la excepción home-relative-path.
  #   · «Abrir en Terminal con Claude Code»: script de usuario en Application Scripts
  #     ejecutado con NSUserAppleScriptTask, en vez de la excepción de Apple Events.
  ArgosAppStore:
    templates: [ArgosMac]
    entitlements:
      path: Argos/ArgosAppStore.entitlements
      properties:
        # iCloud clave-valor: servidores y huellas sincronizados con iPhone/iPad.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: Argos/Info-AppStore.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Victor Alejandro · Licencia Apache-2.0"
        CFBundleIconName: AppIcon
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
        NSAppleEventsUsageDescription: "Argos abre Terminal en la copia local de tu proyecto y arranca Claude Code."
        # Cifrado: solo SSH con algoritmos estándar (open source) → exento (mercado
        # masivo, EAR Cat. 5 Parte 2). Evita la pregunta de cumplimiento en cada build.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: MarkdownUI

  # App de iPhone/iPad (Fase 3: MVP con servidores, proyectos, sesiones y terminal). La CI
  # la compila para garantizar que ArgosCore sigue siendo portable a iOS.
  # Mismo bundle id que la de Mac: una sola ficha en App Store (compra universal).
  ArgosiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ArgosiOS
        excludes:
          - "*.entitlements"
      - path: ArgosCore
      - path: ArgosUI
    entitlements:
      path: ArgosiOS/ArgosiOS.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_NAME: Argos
        PRODUCT_BUNDLE_IDENTIFIER: com.iaportafolio.argos
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Argos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_NSCameraUsageDescription: "Argos usa la cámara para escanear el código QR con el que el Mac te pasa un servidor."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L6WGLNT9XZ
    # Info.plist parcial (se fusiona con el generado): el esquema argos:// permite que la
    # cámara del sistema abra Argos al escanear el QR de «Enviar al iPhone».
    info:
      path: ArgosiOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.iaportafolio.argos.add-server
            CFBundleURLSchemes: [argos]
        # Refresco en segundo plano para avisar de los agentes (AgentNotifier).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.iaportafolio.argos.agents-refresh]
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: MarkdownUI

  ArgosTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ArgosTests
    # Host-less: las pruebas NO lanzan la app (evita que ContentView intente
    # conectar por SSH en CI). @testable import Argos funciona vía testability.
    dependencies:
      - target: Argos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iaportafolio.argos.tests
        GENERATE_INFOPLIST_FILE: "YES"

  # Test de interfaz de extremo a extremo de la app de iPhone contra un servidor real
  # (la cuenta de demostración). Sin ARGOS_DEMO_* en el entorno se salta (CI).
  ArgosiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ArgosiOSUITests
    dependencies:
      - target: ArgosiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iaportafolio.argos.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: ArgosiOS
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L6WGLNT9XZ

schemes:
  ArgosAppStore:
    build:
      targets:
        ArgosAppStore: all
    run:
      config: Debug
    archive:
      config: Release
  ArgosiOS:
    build:
      targets:
        ArgosiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArgosiOSUITests
    archive:
      config: Release
  Argos:
    build:
      targets:
        Argos: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ArgosTests
    profile:
      config: Release
    archive:
      config: Release
