org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# Versión de la app Android (Google Play). Antes de CADA subida a Play, sube ARGOS_VERSION_CODE
# (entero, estrictamente mayor que el último subido: Play rechaza códigos repetidos). Cambia
# ARGOS_VERSION_NAME (lo que ve el usuario) en cada versión pública. Ver android/README.md.
ARGOS_VERSION_NAME=1.2.0
ARGOS_VERSION_CODE=4
