name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

# Mínimo: leer el código. Subir artefactos no necesita permisos del token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Acciones fijadas por SHA (Dependabot las mantiene al día): un tag se puede mover.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # El runner ya trae el SDK (ANDROID_HOME). setup-android@v3 falla pidiendo el paquete
      # obsoleto 'tools', así que usamos su sdkmanager directamente. Compose exige compileSdk 37.
      - name: Instalar plataforma Android 37
        timeout-minutes: 10
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Un sdkmanager colgado por la red bloqueó la CI 40 min: intentos acotados.
          for intento in 1 2 3; do
            timeout 180 "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" && exit 0
            echo "::warning::sdkmanager falló o se colgó (intento $intento); reintentando"
            sleep 10
          done
          exit 1

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      # Los tests de integración de ssh levantan un sshd embebido que ejecuta tmux real.
      # Límite de tiempo: un mirror de apt colgado bloqueó la CI 30 min. Primero sin
      # `update` (el índice del runner suele bastar); si falla, se actualiza y se reintenta.
      - name: Instalar tmux
        timeout-minutes: 5
        run: |
          sudo apt-get install -y -qq tmux \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq tmux)
          tmux -V

      # core es Kotlin/JVM puro: sus tests son la paridad con ArgosTests (Swift).
      - name: Tests del núcleo y de SSH
        run: ./gradlew :core:test :ssh:test

      - name: Build + lint de la app
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      # Release minificado SIN firmar (sin secretos en PRs): R8, recursos, licencias y la
      # comprobación de clases que se cargan por nombre (checkReleaseR8Keeps). La firma y la subida
      # a Play viven en android-release.yml.
      - name: Release sin firmar (R8)
        run: ./gradlew :app:bundleRelease

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            android/core/build/reports/tests
            android/ssh/build/reports/tests
            android/app/build/reports/tests
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
