name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # El runner ya trae el SDK (ANDROID_HOME). setup-android@v3 falla pidiendo el paquete
      # obsoleto 'tools', así que usamos su sdkmanager directamente. Compose exige compileSdk 37.
      - name: Instalar plataforma Android 37
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v5

      # Los tests de integración de ssh levantan un sshd embebido que ejecuta tmux real.
      - name: Instalar tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux

      # core es Kotlin/JVM puro: sus tests son la paridad con ArgosTests (Swift).
      - name: Tests del núcleo y de SSH
        run: ./gradlew :core:test :ssh:test

      - name: Build + lint de la app
        run: ./gradlew :app:assembleDebug :app:lintDebug

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/core/build/reports/tests
            android/ssh/build/reports/tests
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
