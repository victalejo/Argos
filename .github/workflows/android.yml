name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # Las librerías Compose actuales exigen compileSdk 37.
      - name: Instalar plataforma Android 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v5

      # core es Kotlin/JVM puro: sus tests son la paridad con ArgosTests (Swift).
      - name: Tests del núcleo
        run: ./gradlew :core:test

      - name: Build + lint de la app
        run: ./gradlew :app:assembleDebug :app:lintDebug

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
