name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo: leer el código.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tres trabajos en PARALELO (antes eran 3 compilaciones en serie, ~21 min): el reloj pasa a
# ser el del más largo (Mac: compilar + tests, ~10 min). Cada uno es independiente y
# deja su propio resumen.
#
# Acciones fijadas por SHA (Dependabot las mantiene al día): un tag se puede mover.
#   actions/checkout        3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
#   actions/cache           55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
#   actions/upload-artifact cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
#
# Caché: solo los paquetes SwiftPM clonados (clave = Package.resolved). NO se cachea
# DerivedData: Xcode decide recompilar por inodo/fecha de cada fuente, que cambian al
# restaurar, así que la ganancia es incierta y las entradas (cientos de MB por trabajo)
# desalojarían a las demás del límite de 10 GB del repositorio.

env:
  # Brew sin actualizar ni limpiar: ahorra ~1 min por trabajo.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  # Umbral de la puerta de cobertura del NÚCLEO (ArgosCore/), en %. Sube cuando la
  # cobertura suba; nunca se baja para que pase un cambio.
  # Medida en local el 2026-11-18: 66,42 % (6291/9471 líneas) → 66.
  CORE_COVERAGE_MIN: "66"
  # `MaxSessions` del sshd temporal de los tests de integración. OpenSSH usa 10 por
  # defecto; con 4 (menor que el tope de 6 canales cortos de la app) los tests ejercitan el
  # tope adaptativo: la app debe bajar su cupo ante el primer rechazo del servidor.
  SSHD_MAX_SESSIONS: "4"

jobs:
  # Variante Mac (GitHub): comprobación de drift de XcodeGen, compilación, tests con
  # cobertura (puerta sobre ArgosCore/) y tests de integración contra un sshd temporal.
  mac:
    name: Mac (build + test)
    runs-on: macos-15
    # Un xcodebuild colgado no debe gastar las 6 h por defecto. Las suites de scripts
    # remotos (IntegrationServerSuites) suman unos 8 min en serie.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      # xcbeautify: solo se instala si la imagen del runner no lo trae ya.
      - name: Herramientas (XcodeGen, xcbeautify)
        run: |
          for tool in xcodegen xcbeautify; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done

      - name: Caché de paquetes SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Argos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # project.yml es la fuente de verdad. Regeneramos y fallamos si el .pbxproj
      # commiteado quedó desincronizado (drift) — evita el doble-fuente-de-verdad.
      - name: Verificar sincronía XcodeGen (sin drift)
        run: |
          xcodegen generate
          if ! git diff --quiet -- Argos.xcodeproj/project.pbxproj; then
            echo "::error::project.pbxproj desincronizado con project.yml. Ejecuta 'xcodegen generate' y commitea."
            git diff --stat -- Argos.xcodeproj/project.pbxproj
            exit 1
          fi

      - name: Resolver dependencias SPM
        run: xcodebuild -resolvePackageDependencies -project Argos.xcodeproj -scheme Argos -clonedSourcePackagesDirPath .spm

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Argos.xcodeproj -scheme Argos -configuration Debug \
            -destination 'platform=macOS' -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Test (con cobertura)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Argos.xcodeproj -scheme Argos -configuration Debug \
            -destination 'platform=macOS' -clonedSourcePackagesDirPath .spm \
            -enableCodeCoverage YES -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      # Goldens de paridad Swift → Kotlin (android/core/src/test/resources/swift-golden/):
      # GoldenParityTests ya los compara en el paso anterior; aquí se REGENERAN con el Swift
      # real y se falla con el diff en el registro si alguno cambió o falta en el repo.
      - name: Goldens de Android al día
        run: |
          set -o pipefail
          scripts/regenerate-swift-goldens.sh --check --without-building -clonedSourcePackagesDirPath .spm

      # Cobertura del NÚCLEO (ArgosCore/): `Argos.app` incluye las vistas, que los tests no
      # ejercitan, y su porcentaje global dice poco. La puerta falla si el núcleo baja de
      # CORE_COVERAGE_MIN. Informe global + los 15 archivos peor cubiertos en el resumen.
      - name: Cobertura del núcleo (puerta)
        if: always()
        run: |
          if [ ! -d TestResults.xcresult ]; then
            echo "No se generó TestResults.xcresult; se omite el reporte."
            exit 0
          fi
          python3 scripts/coverage_core.py --self-test
          python3 scripts/coverage_core.py TestResults.xcresult \
            --threshold "$CORE_COVERAGE_MIN" --worst 15 --summary-file "$GITHUB_STEP_SUMMARY"

      # Un sshd REAL y temporal (sin root, solo en 127.0.0.1, con MaxSessions bajo) para los
      # fallos que solo aparecen contra un servidor de verdad (agotamiento de canales,
      # reconexión, SFTP en paralelo, túneles) y para los scripts remotos de Argos
      # (projects.json, envío, git, agentes con un `claude` simulado, tmux, Doctor). El paso
      # de parada va siempre. tmux hace falta para las suites de tmux y hooks de Claude.
      - name: Arrancar sshd temporal
        run: |
          command -v tmux >/dev/null || brew install tmux
          scripts/sshd-test-start.sh --max-sessions "$SSHD_MAX_SESSIONS" > /dev/null

      - name: Tests de integración SSH (sshd temporal)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Argos.xcodeproj -scheme Argos -configuration Debug \
            -destination 'platform=macOS' -clonedSourcePackagesDirPath .spm \
            -only-testing:ArgosTests/IntegrationSSHDTests \
            -only-testing:ArgosTests/IntegrationConnectionMonitorTests \
            -only-testing:ArgosTests/IntegrationServerSuites \
            -resultBundlePath IntegrationResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Parar sshd temporal
        if: always()
        run: scripts/sshd-test-stop.sh "${TEST_RUNNER_ARGOS_E2E_SSHD_DIR:-}"

      - name: Subir resultados de tests (fallo)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultados-mac
          path: |
            TestResults.xcresult
            IntegrationResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  # Variante Mac App Store (flag APPSTORE, sin Sparkle ni excepciones temporales):
  # compila el camino #if APPSTORE, que los tests (target Argos) no ejercitan.
  mac-appstore:
    name: Mac App Store (build)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Herramientas (xcbeautify)
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Caché de paquetes SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Argos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Usa el .xcodeproj commiteado: el drift lo verifica el trabajo `mac`.
      - name: Build Mac App Store (ArgosAppStore)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Argos.xcodeproj -scheme ArgosAppStore -configuration Debug \
            -destination 'platform=macOS' -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

  # Guardián de portabilidad: ArgosiOS compila ArgosCore/ para iOS (si alguien mete AppKit
  # o APIs solo-macOS en el núcleo, esto falla) y, ya compilada, ejecuta en un simulador
  # los tests de interfaz que no necesitan red. `DemoServerFlowTests` se salta solo sin
  # ARGOS_DEMO_* (necesita un servidor real).
  ios:
    name: iOS (build + UI tests)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Herramientas (xcbeautify)
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Caché de paquetes SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Argos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Un iPhone disponible de la imagen (el nombre cambia con cada Xcode).
      - name: Elegir simulador
        run: |
          UDID="$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')"
          if [ -z "$UDID" ]; then
            echo "::error::No hay ningún simulador de iPhone disponible."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulador: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      # Compila la app y el bundle de UI tests de una vez (sustituye al `build` genérico).
      - name: Build iOS (portabilidad de ArgosCore)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Argos.xcodeproj -scheme ArgosiOS -configuration Debug \
            -destination "id=$SIM_UDID" -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Tests de interfaz iOS (sin red)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Argos.xcodeproj -scheme ArgosiOS -configuration Debug \
            -destination "id=$SIM_UDID" -clonedSourcePackagesDirPath .spm \
            -only-testing:ArgosiOSUITests/ImportServerLinkTests \
            -resultBundlePath iOSResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Subir resultados y capturas (fallo)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultados-ios
          path: iOSResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
