name: Android release

# AAB firmado con la clave de SUBIDA y, si existe la cuenta de servicio, BORRADOR en la pista interna
# de Google Play (nada se publica sin lanzarlo a mano en Play Console). Secretos: android/README.md.
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Subir el AAB a la pista interna (borrador) si existe ARGOS_PLAY_SERVICE_ACCOUNT"
        type: boolean
        default: true

# Mínimo: leer el código. Subir artefactos no necesita permisos del token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: android

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Sin firma completa la build FALLA (en la CI de PR, en cambio, sale sin firmar).
      ARGOS_REQUIRE_SIGNING: "true"
      HAS_PLAY_ACCOUNT: ${{ secrets.ARGOS_PLAY_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Igual que android.yml: sdkmanager del runner con intentos acotados (uno colgado bloqueó la
      # CI 40 min; setup-android@v3 falla pidiendo el paquete obsoleto 'tools').
      - name: Instalar plataforma Android 37
        timeout-minutes: 10
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for intento in 1 2 3; do
            timeout 180 "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" && exit 0
            echo "::warning::sdkmanager falló o se colgó (intento $intento); reintentando"
            sleep 10
          done
          exit 1

      # Solo lectura de la caché: una build de publicación no escribe caché que luego usen PRs.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Comprobar que el tag coincide con ARGOS_VERSION_NAME
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          version=$(sed -n 's/^ARGOS_VERSION_NAME=//p' gradle.properties)
          tag="${GITHUB_REF_NAME#android-v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con ARGOS_VERSION_NAME=$version (android/gradle.properties)"
            exit 1
          fi

      - name: Decodificar la clave de subida
        env:
          KEYSTORE_BASE64: ${{ secrets.ARGOS_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ARGOS_UPLOAD_KEYSTORE_BASE64 (ver android/README.md → Publicación)"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/argos-upload.jks"
          echo "ARGOS_UPLOAD_STORE_FILE=$RUNNER_TEMP/argos-upload.jks" >> "$GITHUB_ENV"

      - name: Construir y firmar el AAB
        env:
          ARGOS_UPLOAD_STORE_PASSWORD: ${{ secrets.ARGOS_UPLOAD_STORE_PASSWORD }}
          ARGOS_UPLOAD_KEY_ALIAS: ${{ secrets.ARGOS_UPLOAD_KEY_ALIAS }}
          ARGOS_UPLOAD_KEY_PASSWORD: ${{ secrets.ARGOS_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:bundleRelease

      - name: Verificar la firma del AAB
        run: |
          # Avisos de cadena autofirmada/sin timestamp son normales en una clave de subida.
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/verify.txt" 2>&1 || true
          head -n 1 "$RUNNER_TEMP/verify.txt"
          grep -q "^jar verified" "$RUNNER_TEMP/verify.txt"

      - name: Subir el AAB como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: argos-android-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      # Solo si existe el secreto (y, en ejecución manual, si se pidió publicar). Borrador en la
      # pista interna (configurado en app/build.gradle.kts → play {}).
      - name: Subir a Google Play (pista interna, borrador)
        if: env.HAS_PLAY_ACCOUNT == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ARGOS_PLAY_SERVICE_ACCOUNT }}
          ARGOS_UPLOAD_STORE_PASSWORD: ${{ secrets.ARGOS_UPLOAD_STORE_PASSWORD }}
          ARGOS_UPLOAD_KEY_ALIAS: ${{ secrets.ARGOS_UPLOAD_KEY_ALIAS }}
          ARGOS_UPLOAD_KEY_PASSWORD: ${{ secrets.ARGOS_UPLOAD_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          ARGOS_PLAY_SERVICE_ACCOUNT="$RUNNER_TEMP/play-service-account.json" ./gradlew :app:publishReleaseBundle

      - name: Sin cuenta de servicio
        if: env.HAS_PLAY_ACCOUNT != 'true'
        run: echo "::notice::Sin ARGOS_PLAY_SERVICE_ACCOUNT no se sube a Play. Descarga el artefacto argos-android-aab y súbelo en Play Console."

      - name: Borrar secretos del disco
        if: always()
        run: rm -f "$RUNNER_TEMP/argos-upload.jks" "$RUNNER_TEMP/play-service-account.json"
